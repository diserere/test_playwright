<!DOCTYPE html>
<html>  
    <head>
        <title>Sample page</title>
    </head>
    <body>
        <h1>Main Header</h1>
        This is a sample page with some elements.
        <h2>Some H2 header</h2>
        <p>
            Samples of select elements:
        </p>
        <p>
            <label>- Simple select:</label>
            <select id="simple_select_sample">
                <option value="value1">First value</option>
                <option value="value2">Second value</option>
            </select>
        </p>
        <p>
            <label>- Leveled select:</label>
            <select id="leveled_select_sample">
                <option value="">Choose option</option>
                <optgroup label="Main">
                    <option value="value1">First value</option>
                    <option value="value2">Second value</option>
                </optgroup>
                <optgroup label="Additional">
                    <option value="value_add_1">Additional first value</option>
                    <option value="value_add_2">Additional second value</option>
                    <option value="value_add_3" disabled>Additional three value</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="pet-select">- Choose a pet:</label>

            <select name="pets" id="pet-select">
            <option value="">--Please choose an option--</option>
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="hamster">Hamster</option>
            <option value="parrot">Parrot</option>
            <option value="spider">Spider</option>
            <option value="goldfish">Goldfish</option>
            </select>

        </p>
    </body>
</html>
