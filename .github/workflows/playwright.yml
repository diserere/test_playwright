name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  checks: write
  contents: write
  pull-requests: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Ensure browsers are installed
      run: python -m playwright install --with-deps
    - name: Run tests
      run: pytest --tracing=retain-on-failure
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-traces
        path: test-results/
    - name: Generate and publish Allure Report
      uses: allure-framework/allure-report@v1.3.1 # Use the official action
      with:
        report-directory: allure-report # The output directory for the HTML report
        results-directory: allure-results # The input directory with raw results
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Set 'publish-pages: true' to automatically publish to GitHub Pages
        publish-pages: true
        # Set 'publish-broken-tests-issue: true' to create issues for broken tests (optional)
        # publish-broken-tests-issue: true
